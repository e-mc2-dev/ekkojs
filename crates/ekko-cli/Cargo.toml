[package]
name = "ekko-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ekko"
path = "src/main.rs"

[dependencies]
ekko-core = { path = "../ekko-core" }
ekko-gui = { path = "../ekko-gui", optional = true }
ekko-tui = { path = "../ekko-tui" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
glob = "0.3"
ekko-vfs = { path = "../ekko-vfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
crossterm = "0.28"
mimalloc = { version = "0.1", default-features = false }
walkdir = "2"
notify = "8"
rustyline = "14"
unicode-width = "0.2"
# "termination" so the dev Ctrl+C guard also catches SIGTERM/SIGHUP (terminal close, `kill`), not just
# SIGINT — required on macOS where there is no PR_SET_PDEATHSIG backstop for the child process group.
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
# setsid / prctl(PR_SET_PDEATHSIG) / killpg for the dev-server process group — see src/dev_supervisor.rs.
libc = "0.2"

[features]
# `gui` (default) links ekko-gui -> wry/tao/gtk for the DESKTOP build. The SERVER build is `--no-default-features`:
# headless, no WebKitGTK link, so it runs on a minimal (distroless) Linux/Docker image.
default = ["gui"]
gui = ["dep:ekko-gui"]
