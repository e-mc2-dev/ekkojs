[package]
name = "ekko-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ekko"
path = "src/main.rs"

[dependencies]
ekko-core = { path = "../ekko-core" }
ekko-gui = { path = "../ekko-gui" }
ekko-tui = { path = "../ekko-tui" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
glob = "0.3"
ekko-vfs = { path = "../ekko-vfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
crossterm = "0.28"
mimalloc = { version = "0.1", default-features = false }
walkdir = "2"
notify = "8"
rustyline = "14"
unicode-width = "0.2"

[features]
default = []
