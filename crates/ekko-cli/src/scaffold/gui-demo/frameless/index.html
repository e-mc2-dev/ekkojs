<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frameless</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #18181b; color: #fafafa; height: 100vh; display: flex; flex-direction: column; }
    .titlebar { height: 32px; background: #27272a; display: flex; align-items: center; padding: 0 12px; -webkit-app-region: drag; user-select: none; }
    .titlebar-title { font-size: 12px; color: #a1a1aa; flex: 1; }
    .titlebar-btn { -webkit-app-region: no-drag; width: 28px; height: 28px; border: none; background: none; color: #a1a1aa; cursor: pointer; font-size: 14px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .titlebar-btn:hover { background: #3f3f46; }
    .titlebar-btn.close:hover { background: #dc2626; color: white; }
    .content { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
    .content p { color: #71717a; font-size: 13px; }
    .content code { background: #27272a; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">Frameless Window</span>
    <button class="titlebar-btn" onclick="window.ekko.send({type:'window-control', action:'minimize'})">&#x2500;</button>
    <button class="titlebar-btn" onclick="window.ekko.send({type:'window-control', action:'maximize'})">&#x25A1;</button>
    <button class="titlebar-btn close" onclick="window.ekko.send({type:'window-control', action:'close'})">&#x2715;</button>
  </div>
  <div class="content">
    <p>Custom titlebar built in HTML/CSS</p>
    <p><code>decorations: false</code> removes the OS frame</p>
    <p>Drag the titlebar to move the window</p>
  </div>
</body>
</html>
