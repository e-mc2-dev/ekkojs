[package]
name = "ekko-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
libloading = "0.8"
v8 = "130"
swc_ts_fast_strip = "49"
swc_common = { version = "21", features = ["sourcemap"] }
swc_ecma_parser = "39"
swc_ecma_ast = "23"
swc_ecma_visit = "23"
swc_ecma_codegen = "26"
notify = "8"
simdutf8 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
glob = "0.3"
sha2 = "0.10"
ekko-vfs = { path = "../ekko-vfs" }
grass = "0.13"
lightningcss = "1.0.0-alpha.71"
crossterm = "0.28"
walkdir = "2"
graphql-parser = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
# ekko:image — pure-Rust codecs only (NO avif → no libdav1d/nasm C deps; stays cross-compilable). Task 274.
image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "gif", "bmp", "ico", "tiff", "pnm", "tga", "qoi", "ff", "hdr", "exr", "webp",
] }

[build-dependencies]
sha2 = "0.10"

[features]
default = []
