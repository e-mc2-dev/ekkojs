[workspace]
members = ["crates/*"]
default-members = ["crates/ekko-cli", "crates/ekko-core", "crates/ekko-bindgen", "crates/ekko-vfs"]
resolver = "3"

[workspace.package]
version = "0.8.10"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
